name: build

# 每次推送 / PR 都在干净的 GitHub 托管环境里真实执行 `./gradlew build`，
# 产出可安装的 Fabric jar 并作为 artifact 上传，便于在没有本地 JDK 21 时验证。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric mod (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: List produced artifacts
        run: ls -lh build/libs/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canvas-menu-jars
          path: build/libs/*.jar
          if-no-files-found: error
